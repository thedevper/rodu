# Licences allowed in what Rodu ships: the rodu binary and the WebAssembly board it serves.
# `cargo xtask notices` fails on any crate outside this list, so adding a licence is a decision.
accepted = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
]
# Every target a release is built for, including the browser board.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
# Build scripts, proc macros' build deps and test-only crates are not shipped.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Rodu's own crates are covered by LICENSE and NOTICE.
private = { ignore = true }

# MPL-2.0 is accepted for these crates only, which Loro (rodu-sync) depends on; any other MPL
# crate still fails the build. (A `[crate-name]` table's `accepted` adds licences for that crate
# alone: `KrateConfig` in cargo-about 0.9.2, src/licenses/config.rs.) MPL-2.0 needs its text (below) and where to get each crate's
# source, which THIRD-PARTY-NOTICES.txt gives for every crate. See docs/adr/0001-sync-crdt.md.
[im]
accepted = ["MPL-2.0"]

[sized-chunks]
accepted = ["MPL-2.0"]

[bitmaps]
accepted = ["MPL-2.0"]
