[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/rodu-core", "crates/rodu-store", "crates/rodu-sync", "crates/rodu-api", "crates/rodu-mcp", "crates/rodu-http", "crates/rodu"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/thedevper/rodu"
authors = ["TheDevper"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The web UI ships as WASM; keep it small.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
