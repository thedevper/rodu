[package]
name = "rodu-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
hex = "0.4.3"
loro = "1.16.2"
rodu-core = { version = "0.3.0", path = "../rodu-core" }
rodu-store = { version = "0.3.0", path = "../rodu-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["macros"] }
xxhash-rust = { version = "0.8.19", features = ["xxh32"] }
