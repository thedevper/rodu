[package]
name = "rodu-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
rodu-core = { version = "0.3.0", path = "../rodu-core" }
rodu-store = { version = "0.3.0", path = "../rodu-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt"] }

[lints]
workspace = true

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["client"] }
rusqlite = "0.40.2"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util"] }
