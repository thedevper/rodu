[package]
name = "rodu-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
hex = "0.4.3"
rodu-api = { version = "0.1.0", path = "../rodu-api" }
rodu-core = { version = "0.1.0", path = "../rodu-core" }
rodu-store = { version = "0.1.0", path = "../rodu-store" }
serde = "1.0.229"
serde_json = "1.0.151"
